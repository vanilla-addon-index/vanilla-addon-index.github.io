version: 2
updates:
  # Routine updates arrive together, one pull request a week per ecosystem.
  # A new major version gets a pull request of its own, since those are the ones that break things.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # svelte-check does not support TypeScript 7 yet; remove this once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The workflows name each action by the exact commit, with its version in a comment, so that
  # no outside code changes under them without a pull request. This is what keeps those
  # commits current: it updates the commit and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
