name: Backup

# A full copy of the hosted database every night: every table of the site and the accounts.
# The free Supabase plan keeps no backups of its own. The copy holds private data and this
# repository is public, so it is encrypted before it is stored; without the passphrase the
# file kept here is of no use to anyone. GitHub keeps each night's copy for 90 days.
#
# To use one: download it from the run's page, then
#   gpg --decrypt backup.tar.gz.gpg > backup.tar.gz
# Extract it outside the repository and follow its README.md.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    # The secrets are kept in this environment, which only main may use.
    environment: database
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Whether a backup was made, for the job below.
    outputs:
      made: ${{ steps.ready.outputs.go }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets
        id: ready
        # Forks may omit credentials; the production repository must never report a
        # successful backup when no copy was made.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            if [ "$GITHUB_REPOSITORY" = "vanilla-addon-index/vanilla-addon-index.github.io" ]; then
              echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and BACKUP_PASSPHRASE are required. No backup was created."
              exit 1
            fi
            echo "::notice::Backup credentials are incomplete in this repository; skipping the backup."
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.go
      # The site's dependencies are not installed: the job that holds the database password
      # runs the Supabase tool, in the version the lockfile names, and our own script.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.go
        with:
          node-version: 24
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.ready.outputs.go

      - name: Back up and encrypt
        if: steps.ready.outputs.go
        # Encrypt the data and its matching recovery files together.
        env:
          SUPABASE_CLI: supabase
        run: |
          supabase link --project-ref mefmmugajnbbotioplfw
          recovery="$RUNNER_TEMP/recovery"
          mkdir -p "$recovery/supabase" "$recovery/scripts" "$recovery/src/lib"
          trap 'rm -rf "$recovery" "$RUNNER_TEMP/backup.tar.gz"' EXIT
          node scripts/backup.mjs "$recovery/backup.sql"
          cp -R supabase/migrations "$recovery/supabase/"
          cp supabase/config.toml "$recovery/supabase/"
          cp package.json package-lock.json "$recovery/"
          cp scripts/backup.mjs "$recovery/scripts/"
          cp src/lib/config.ts "$recovery/src/lib/"
          cp docs/backup-restore.md "$recovery/README.md"
          export BACKUP_CLI_VERSION="$(supabase --version)"
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const e = process.env;
            writeFileSync(e.RUNNER_TEMP + "/recovery/manifest.json", JSON.stringify({
              version: 1, createdAt: new Date().toISOString(), repository: e.GITHUB_REPOSITORY,
              commit: e.GITHUB_SHA, runId: e.GITHUB_RUN_ID, runAttempt: e.GITHUB_RUN_ATTEMPT,
              node: process.version, supabaseCli: e.BACKUP_CLI_VERSION
            }, null, 2) + "\n");'
          tar -czf "$RUNNER_TEMP/backup.tar.gz" -C "$recovery" .
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" --output backup.tar.gz.gpg "$RUNNER_TEMP/backup.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ready.outputs.go
        with:
          name: backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Check that it restores
        if: steps.ready.outputs.go
        # A backup nobody has tried to restore is a hope, not a backup. The stored file is
        # opened with the passphrase and loaded into a throwaway database built from the
        # migrations inside this run; a copy that does not load, or holds no accounts,
        # fails the run. The copy is kept either way: it is uploaded before this step.
        env:
          SUPABASE_CLI: supabase
        run: |
          restored="$RUNNER_TEMP/restored"
          mkdir -p "$restored"
          trap 'rm -rf "$restored" "$RUNNER_TEMP/restored.tar.gz"' EXIT
          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" --output "$RUNNER_TEMP/restored.tar.gz" backup.tar.gz.gpg
          tar -xzf "$RUNNER_TEMP/restored.tar.gz" -C "$restored"
          cd "$restored"
          supabase start -x realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          node scripts/backup.mjs check backup.sql

  keep:
    # A second place for the copies, outside GitHub's own storage for workflow files: the
    # last seven are kept on the "backups" branch, which every mirror of this repository
    # picks up by itself. Only once the copy has been shown to restore, and with no secret:
    # this job is given the stored file, already encrypted, and the right to push.
    #
    # The branch is a single commit that replaces the one before, like the snapshot's, so
    # old copies do not pile up in its history and what is deleted from the site is gone
    # from here a week later. The files are public and of no use without the passphrase.
    name: Keep the last seven on a branch
    needs: backup
    if: needs.backup.outputs.made
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add tonight's copy and drop the oldest
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          keep="$RUNNER_TEMP/keep"
          mkdir -p "$keep"
          if git fetch --depth 1 origin backups; then
            git archive FETCH_HEAD | tar -x -C "$keep"
          fi
          gh run download "$GITHUB_RUN_ID" --name "backup-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/new"
          cp "$RUNNER_TEMP/new/backup.tar.gz.gpg" "$keep/backup-$(date -u +%F).tar.gz.gpg"
          # Replace a legacy SQL-only copy from the same date, if present.
          rm -f "$keep/backup-$(date -u +%F).sql.gpg"
          # The names sort by date: everything but the newest seven goes.
          ls -1 "$keep" | grep -E '^backup-.*\.(sql|tar\.gz)\.gpg$' | sort | head -n -7 | while read -r old; do
            rm -- "${keep:?}/${old:?}"
          done
          printf '%s\n' \
            "The last seven nightly backups of the site's database, encrypted." \
            "" \
            "Written by the Backup workflow on the main branch, whose README says how to open" \
            "and restore one. Without the passphrase these files are of no use to anyone." \
            "New .tar.gz.gpg copies include matching migrations, tool versions and recovery instructions." \
            > "$keep/README.md"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index"
          git --work-tree="$keep" add -A .
          commit=$(git commit-tree "$(git write-tree)" -m "Nightly backups")
          git push --force origin "$commit:refs/heads/backups"
          ls -1 "$keep"
