name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily: refreshes the snapshot and pre-rendered addon pages, and keeps Supabase active.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The database rules are tested on a throwaway copy; a failure stops the deploy.
      - run: npm test

      - name: Apply database migrations
        # Brings the hosted database up to supabase/migrations before the site that needs it
        # goes out. A failure stops the deploy, so the site is never ahead of its database.
        # Skips itself until both secrets exist; `npm run db:push` does the same by hand.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set, skipping migrations."
            exit 0
          fi
          npx supabase link --project-ref mefmmugajnbbotioplfw
          npx supabase db push --linked

      - name: Fetch the last snapshot
        # The snapshot lives on a branch of its own, so this workflow never pushes to main:
        # a push of yours cannot collide with it, and your copy of main is never behind it.
        # The last one is what the site is built from if the database cannot be reached.
        run: |
          if git fetch --depth 1 origin snapshot; then
            git worktree add -B snapshot "$RUNNER_TEMP/snapshot" FETCH_HEAD
            cp "$RUNNER_TEMP/snapshot/addons.json" static/addons.json
          else
            git worktree add --orphan -b snapshot "$RUNNER_TEMP/snapshot"
          fi

      - name: Import from the wiki
        # Nightly and manual runs only. Skips itself until the SUPABASE_SECRET_KEY secret exists.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly.mjs

      - name: Export snapshot
        # A database outage must not block the deploy; the previous snapshot is kept.
        continue-on-error: true
        run: node scripts/export.mjs

      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Save snapshot
        # After the site is out, so a failure here is seen but holds nothing up. Runs of
        # this workflow wait for one another, so two never push at once.
        run: |
          [ -f static/addons.json ] || exit 0
          cd "$RUNNER_TEMP/snapshot"
          cp "$GITHUB_WORKSPACE/static/addons.json" addons.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons.json
          git diff --cached --quiet || (git commit -m "Update addon snapshot" && git push origin snapshot)
