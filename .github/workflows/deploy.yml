name: Deploy

# Every main change, or by hand. Nightly and Refresh call Publish directly and hold
# the same lock on their calling job, so it covers the entire reusable workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    concurrency:
      group: publication
      cancel-in-progress: false
      # Retain waiting code deployments even if a later timer uses an older commit.
      queue: max
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
