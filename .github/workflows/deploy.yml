name: Deploy

# Puts the site out: on every change to main, after the nightly import (see nightly.yml),
# and by hand. It checks the code itself first, so nothing broken goes out whichever way
# the change got to main.
#
# Three jobs, one after the other, so that the database password is never in a job that
# installs the site's dependencies or runs its build: whatever those packages do, they
# cannot read it.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    # The database rules, on a throwaway copy, and the types. A failure stops the deploy.
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  migrate:
    # Brings the hosted database up to supabase/migrations before the site that needs it
    # goes out. A failure stops the deploy, so the site is never ahead of its database.
    # This job installs the Supabase tool and nothing else.
    name: Database migrations
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One at a time; the next one waits.
    concurrency:
      group: migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version the lockfile names, so it is the tool the migrations were tested with.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: Apply database migrations
        # Skips itself until both secrets exist; `npm run db:push` does the same by hand.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set, skipping migrations."
            exit 0
          fi
          supabase link --project-ref mefmmugajnbbotioplfw
          supabase db push --linked

  deploy:
    # Builds the site and publishes it. Given no database secret: the snapshot is read
    # with the public key.
    name: Deploy
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Pushes the snapshot to its own branch, and publishes to GitHub Pages.
      contents: write
      pages: write
      id-token: write
    # One deploy at a time; the next one waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Fetch the last snapshot
        # The snapshot lives on a branch of its own, so this workflow never pushes to main:
        # a push of yours cannot collide with it, and your copy of main is never behind it.
        # The last one is what the site is built from if the database cannot be reached.
        run: |
          if git fetch --depth 1 origin snapshot; then
            git worktree add -B snapshot "$RUNNER_TEMP/snapshot" FETCH_HEAD
            cp "$RUNNER_TEMP/snapshot/addons.json" static/addons.json
          else
            git worktree add --orphan -b snapshot "$RUNNER_TEMP/snapshot"
          fi

      - name: Export snapshot
        # A database outage must not block the deploy; the previous snapshot is kept.
        continue-on-error: true
        run: node scripts/export.mjs

      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Save snapshot
        # After the site is out, so a failure here is seen but holds nothing up. Deploys
        # wait for one another, so two never push at once.
        run: |
          [ -f static/addons.json ] || exit 0
          cd "$RUNNER_TEMP/snapshot"
          cp "$GITHUB_WORKSPACE/static/addons.json" addons.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons.json
          git diff --cached --quiet || (git commit -m "Update addon snapshot" && git push origin snapshot)
