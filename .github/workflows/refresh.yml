name: Refresh

# Every hour: compares the full public snapshot and application commit with the
# confirmed Pages publication, and calls Publish only when it may need to change.
# A visitor's browser asks the database for whatever is newer than the snapshot,
# so a fresher snapshot keeps those
# answers small; it is also what takes a deleted addon out of the list visitors see, and
# what gives a new one a page of its own for search engines and link previews.
#
# Most runs find nothing changed and end after one short job. GitHub runs timers like
# these late, sometimes by hours; nothing depends on the exact time.
#
# The three timed workflows start at different minutes of the hour (Nightly at 17, Backup
# at 43, this one at 53). That only spreads them on paper, since GitHub starts them when
# it gets to them. Each publication holds one shared lock from preparation through
# saving the published snapshot; see the calling jobs here, in Nightly and in Deploy.
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  changed:
    # Reads the list with the public key, the way any visitor could, and compares it with
    # the snapshot the site went out with. Given no secret, and installs nothing.
    name: Does publication need to change?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Compare with the confirmed publication
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_PREVIOUS: ${{ runner.temp }}/last-publication.json
        # A list far shorter than the last snapshot fails here, as it does in the deploy:
        # see scripts/export.mjs. So does a database that cannot be reached; the next run
        # tries again.
        run: |
          if git fetch --depth 1 origin snapshot; then
            if git show FETCH_HEAD:addons.json > "$RUNNER_TEMP/last-addons.json"; then
              cp "$RUNNER_TEMP/last-addons.json" static/addons.json
            fi
            git show FETCH_HEAD:publication.json > "$RUNNER_TEMP/last-publication.json" 2>/dev/null || true
          fi
          node scripts/export.mjs
          node scripts/publication-state.mjs

  deploy:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
    # The calling job holds this lock until publication AND snapshot saving finish.
    concurrency:
      group: publication
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/publish.yml
    secrets: inherit
