name: Validate and prepare database

# Reused before both the importer and deployment. Dependency installation and tests
# stay in a separate job from the database credentials.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # The database rules, on a throwaway copy, and the types. Main can reuse only an
    # exact successful receipt for this commit AND actual runtime. A miss runs checks.
    name: Tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Identify validation inputs
        id: identity
        run: VALIDATION_NPM="$(npm --version)" node scripts/deploy-validation.mjs key
      - name: Find successful main validation
        id: validation
        if: github.ref == 'refs/heads/main' && steps.identity.outputs.key != ''
        # Cache outages must fall back to fresh checks, not stop preparation.
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deploy-validation/success.json
          key: ${{ steps.identity.outputs.key }}
      - name: Verify successful validation receipt
        id: reuse
        if: github.ref == 'refs/heads/main' && steps.validation.outcome == 'success' && steps.validation.outputs.cache-hit == 'true'
        env:
          VALIDATION_KEY: ${{ steps.identity.outputs.key }}
          VALIDATION_RECEIPT: ${{ runner.temp }}/deploy-validation/success.json
        run: node scripts/deploy-validation.mjs reuse
      - if: steps.reuse.outputs.reuse != 'true'
        run: npm ci
      - id: tests
        if: steps.reuse.outputs.reuse != 'true'
        run: npm test
      - id: types
        if: steps.reuse.outputs.reuse != 'true'
        run: npm run check
      - name: Record successful main validation
        id: receipt
        # Never certify a PR, a failed check, or a reused receipt as a fresh success.
        if: github.ref == 'refs/heads/main' && steps.identity.outputs.key != '' && steps.tests.outcome == 'success' && steps.types.outcome == 'success'
        env:
          VALIDATION_KEY: ${{ steps.identity.outputs.key }}
          VALIDATION_RECEIPT: ${{ runner.temp }}/deploy-validation/success.json
        run: node scripts/deploy-validation.mjs record
      - name: Remember successful main validation
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deploy-validation/success.json
          key: ${{ steps.identity.outputs.key }}

  migrate:
    # Brings the hosted database up to supabase/migrations before the site that needs it
    # goes out. A failure stops the deploy, so the site is never ahead of its database.
    # This job installs the Supabase tool and nothing else.
    #
    # From main only. A run started by hand on another branch would otherwise apply that
    # branch's migrations, which nobody has merged, to the hosted database. There it stops
    # after the checks: this job is skipped, and the deploy that needs it with it.
    name: Database migrations
    needs: check
    if: github.ref == 'refs/heads/main'
    # The secrets are kept in this environment, which only main may use, so a workflow
    # changed on another branch is not given them at all.
    environment: database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # One at a time; the next one waits.
    concurrency:
      group: migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version the lockfile names, so it is the tool the migrations were tested with.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      - name: Apply database migrations
        # Missing credentials fail before any dependent import or build can start.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required for migrations."
            exit 1
          fi
          supabase link --project-ref mefmmugajnbbotioplfw
          supabase db push --linked
