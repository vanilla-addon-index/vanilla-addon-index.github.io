name: Nightly

# Once a day: reads the wiki into the import queue and asks GitHub about every repository,
# then deploys, which refreshes the snapshot and the pre-rendered addon pages. The daily
# read of the database is also what keeps the free Supabase project from being paused,
# and the first job below is what keeps GitHub from switching this timer off.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  keepalive:
    # GitHub switches off the timers of a public repository that has had no activity for 60
    # days, and nothing commits to main by itself. With the timers off there would be no
    # backups, no import and no deploys, and Supabase would pause the project within about
    # a week. Marking a workflow as enabled, which it already is, is what starts the 60
    # days again.
    #
    # GitHub does not promise that. It warns by email before it switches a timer off, to
    # whoever watches this repository: that email is the backstop, and "Enable workflow"
    # on the Actions page is the way back.
    name: Keep the schedules on
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Mark the scheduled workflows as enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in nightly.yml backup.yml refresh.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            echo "$workflow is enabled."
          done

  import:
    # From main only: a run started by hand on another branch would otherwise write to the
    # hosted database with that branch's script, which nobody has merged.
    name: Import from the wiki
    if: github.ref == 'refs/heads/main'
    # The token is kept in this environment, which only main may use.
    environment: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # How many reports and suggestions wait for an admin, for the job below.
    outputs:
      reports: ${{ steps.nightly.outputs.reports }}
      suggestions: ${{ steps.nightly.outputs.suggestions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script uses nothing that needs installing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Import from the wiki
        id: nightly
        # Skips itself until the NIGHTLY_TOKEN secret exists. The token is good for this
        # job's three database calls and nothing else; `npm run nightly:token` makes one.
        env:
          NIGHTLY_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly.mjs

  notify:
    # Tells the admins when something on the site is waiting for them: a report nobody has
    # closed, or a member's suggestion nobody has decided. Never for anything that needs no
    # admin, such as a new addon. The site sends no email, so this goes through GitHub: one
    # issue, assigned to whoever should hear of it, which GitHub emails them about. It is
    # opened when something waits, gets a comment when more arrives, and closes itself when
    # nothing is left. Issues are public, so it holds the two numbers and nothing else.
    name: Tell the admins what is waiting
    needs: import
    if: ${{ !cancelled() && needs.import.outputs.reports != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS: ${{ needs.import.outputs.reports }}
          SUGGESTIONS: ${{ needs.import.outputs.suggestions }}
          # Who is told, by their GitHub name; several are separated by commas.
          TELL: akzkak
          ADMIN_PAGE: https://vanilla-addon-index.github.io/admin/reports
        run: |
          total=$((REPORTS + SUGGESTIONS))
          title="Waiting for an admin: $REPORTS reports, $SUGGESTIONS suggestions"
          # The label is how the issue is found again; only people with rights here can set it.
          gh label create needs-admin --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "Something on the site is waiting for an admin" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label needs-admin --state open --limit 1 \
            --json number,title --jq '.[0] | select(.) | "\(.number)\t\(.title)"')
          number=${open%%$'\t'*}
          before=${open#*$'\t'}

          if [ "$total" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Nothing is waiting any more."
            fi
            exit 0
          fi

          body="On the site, $REPORTS reports and $SUGGESTIONS suggestions from members are waiting for an admin: $ADMIN_PAGE

          The Nightly workflow keeps this issue up to date and closes it when nothing is left."
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label needs-admin --assignee "$TELL"
          elif [ "$before" != "$title" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            # A comment is what sends a notification; only when there is more than before.
            was=0
            for n in $(echo "$before" | grep -oE '[0-9]+'); do was=$((was + n)); done
            if [ "$total" -gt "$was" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "More is waiting now: $REPORTS reports and $SUGGESTIONS suggestions. $ADMIN_PAGE"
            fi
          fi

  deploy:
    # The site goes out even when the import failed; the failed job still shows.
    needs: import
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
