name: Nightly

# Once a day: reads the wiki into the import queue and asks GitHub about every repository,
# then deploys, which refreshes the snapshot and the pre-rendered addon pages. The daily
# read of the database is also what keeps the free Supabase project from being paused,
# and the first job below is what keeps GitHub from switching this timer off.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  keepalive:
    # GitHub switches off the timers of a public repository that has had no activity for 60
    # days, and nothing commits to main by itself. With the timers off there would be no
    # backups, no import and no deploys, and Supabase would pause the project within about
    # a week. Marking a workflow as enabled, which it already is, is what starts the 60
    # days again.
    #
    # GitHub does not promise that. It warns by email before it switches a timer off, to
    # whoever watches this repository: that email is the backstop, and "Enable workflow"
    # on the Actions page is the way back.
    name: Keep the schedules on
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Mark the scheduled workflows as enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in nightly.yml backup.yml refresh.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            echo "$workflow is enabled."
          done

  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  import:
    needs: prepare
    # From main only: a run started by hand on another branch would otherwise write to the
    # hosted database with that branch's script, which nobody has merged.
    name: Import from the wiki and OctoWoW
    if: github.ref == 'refs/heads/main'
    # The token is kept in this environment, which only main may use.
    environment: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # How many reports, suggestions and imports wait for an admin, for the job below.
    outputs:
      reports: ${{ steps.nightly.outputs.reports }}
      suggestions: ${{ steps.nightly.outputs.suggestions }}
      imports: ${{ steps.nightly.outputs.imports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script uses nothing that needs installing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Import from the wiki and OctoWoW
        id: nightly
        # Missing tokens fail before the import starts; `npm run nightly:token` makes
        # the narrow database token used by the nightly RPCs.
        env:
          NIGHTLY_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly.mjs

  notify:
    # One public issue with counts only; notify when any category increases.
    name: Tell the admins what is waiting
    needs: import
    if: ${{ !cancelled() && needs.import.outputs.reports != '' && needs.import.outputs.suggestions != '' && needs.import.outputs.imports != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS: ${{ needs.import.outputs.reports }}
          SUGGESTIONS: ${{ needs.import.outputs.suggestions }}
          IMPORTS: ${{ needs.import.outputs.imports }}
          # Who is told, by their GitHub name; several are separated by commas.
          TELL: akzkak
        run: node scripts/notify-admin.mjs

  deploy:
    # The site goes out even when the import failed; the failed job still shows.
    needs: [prepare, import]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' }}
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
    # The calling job holds this lock until publication AND snapshot saving finish.
    concurrency:
      group: publication
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/publish.yml
    with:
      prepared: true
    secrets: inherit
